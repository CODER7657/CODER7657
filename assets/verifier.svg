<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Three benchmark runs: oracle scores 1.00, empty agent 0.00, deliberately sabotaged solution 0.00">
  <title>Adversarial verification — I break my own solution to prove the grader is honest</title>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d141c"/><stop offset="100%" stop-color="#070b10"/></linearGradient>
    <linearGradient id="gfill" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e6b47"/><stop offset="100%" stop-color="#3ee08f"/></linearGradient>
    <linearGradient id="rfill" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6b1e26"/><stop offset="100%" stop-color="#ff5c5c"/></linearGradient>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      text { dominant-baseline: middle; }
      .bar { transform-box: fill-box; transform-origin: left center; }
      .b1 { animation: fill100 10s cubic-bezier(.2,.8,.2,1) 0.6s infinite both; }
      .b2 { animation: fill0   10s cubic-bezier(.2,.8,.2,1) 3.0s infinite both; }
      .b3 { animation: snap    10s cubic-bezier(.2,.8,.2,1) 5.4s infinite both; }
      @keyframes fill100 { 0% { transform: scaleX(0) } 12%,88% { transform: scaleX(1) } 100% { transform: scaleX(1) } }
      @keyframes fill0   { 0%,100% { transform: scaleX(0.004) } }
      @keyframes snap    { 0% { transform: scaleX(0) } 9% { transform: scaleX(.75) } 15% { transform: scaleX(.75) } 20%,100% { transform: scaleX(0.004) } }

      .pill { animation: pop 10s ease-out infinite both; transform-box: fill-box; transform-origin: center; }
      @keyframes pop { 0% { opacity:0; transform: scale(.5) } 6% { opacity:1; transform: scale(1.18) } 10%,92% { opacity:1; transform: scale(1) } 100% { opacity:1; transform: scale(1) } }
      .fail3 { animation: shake 10s ease-out 6.0s infinite both; transform-box: fill-box; transform-origin: center; }
      @keyframes shake { 0%,4% { opacity:0 } 6% { opacity:1; transform: translateX(-3px) } 7.5% { transform: translateX(3px) } 9% { transform: translateX(-2px) } 11%,100% { transform: translateX(0); opacity:1 } }

      .val { animation: reveal 10s ease-out infinite both; }
      @keyframes reveal { 0% { opacity:0 } 14%,94% { opacity:1 } 100% { opacity:1 } }
      .v1 { animation-delay: .6s } .v2 { animation-delay: 3.0s } .v3 { animation-delay: 5.4s }
      .note { animation: note 10s ease-out 7.4s infinite both; }
      @keyframes note { 0% { opacity:0; transform: translateY(6px) } 8%,95% { opacity:1; transform: translateY(0) } 100% { opacity:1 } }
      .scan { animation: scan 10s linear infinite; }
      @keyframes scan { 0% { opacity:0 } 2% { opacity:.5 } 100% { opacity:0; transform: translateX(880px) } }
    </style>
  </defs>

  <rect width="900" height="300" rx="14" fill="url(#bg3)"/>
  <rect x=".75" y=".75" width="898.5" height="298.5" rx="14" fill="none" stroke="#1b2836" stroke-width="1.5"/>
  <rect class="scan" x="0" y="0" width="2" height="300" fill="#4dd6ff" opacity="0"/>

  <text class="m" x="24" y="28" font-size="13" fill="#e6f2fb">harbor run — verifier integrity check</text>
  <text class="m" x="876" y="28" font-size="11.5" fill="#3d5265" text-anchor="end">a grader you can fool is not a grader</text>
  <path d="M24 46 H876" stroke="#1b2836"/>

  <!-- row 1: oracle -->
  <text class="m" x="24" y="82" font-size="12.5" fill="#8aa0b4">oracle solution</text>
  <rect x="184" y="72" width="440" height="20" rx="6" fill="#101a24" stroke="#1f2f3d"/>
  <rect class="bar b1" x="185" y="73" width="438" height="18" rx="5" fill="url(#gfill)"/>
  <text class="m val v1" x="646" y="82" font-size="15" font-weight="700" fill="#3ee08f">reward 1.00</text>
  <g class="m" font-size="9" text-anchor="middle" fill="#0b1410">
    <g class="pill" style="animation-delay:.7s"><rect x="778" y="73" width="20" height="18" rx="5" fill="#3ee08f"/><text x="788" y="83">✓</text></g>
    <g class="pill" style="animation-delay:.85s"><rect x="802" y="73" width="20" height="18" rx="5" fill="#3ee08f"/><text x="812" y="83">✓</text></g>
    <g class="pill" style="animation-delay:1.0s"><rect x="826" y="73" width="20" height="18" rx="5" fill="#3ee08f"/><text x="836" y="83">✓</text></g>
    <g class="pill" style="animation-delay:1.15s"><rect x="850" y="73" width="20" height="18" rx="5" fill="#3ee08f"/><text x="860" y="83">✓</text></g>
  </g>

  <!-- row 2: nop -->
  <text class="m" x="24" y="142" font-size="12.5" fill="#8aa0b4">agent that does nothing</text>
  <rect x="184" y="132" width="440" height="20" rx="6" fill="#101a24" stroke="#1f2f3d"/>
  <rect class="bar b2" x="185" y="133" width="438" height="18" rx="5" fill="url(#rfill)"/>
  <text class="m val v2" x="646" y="142" font-size="15" font-weight="700" fill="#ff5c5c">reward 0.00</text>
  <g class="m" font-size="9" text-anchor="middle" fill="#1a0b0d">
    <g class="pill" style="animation-delay:3.1s"><rect x="778" y="133" width="20" height="18" rx="5" fill="#ff5c5c"/><text x="788" y="143">✕</text></g>
    <g class="pill" style="animation-delay:3.25s"><rect x="802" y="133" width="20" height="18" rx="5" fill="#ff5c5c"/><text x="812" y="143">✕</text></g>
    <g class="pill" style="animation-delay:3.4s"><rect x="826" y="133" width="20" height="18" rx="5" fill="#ff5c5c"/><text x="836" y="143">✕</text></g>
    <g class="pill" style="animation-delay:3.55s"><rect x="850" y="133" width="20" height="18" rx="5" fill="#ff5c5c"/><text x="860" y="143">✕</text></g>
  </g>

  <!-- row 3: sabotaged -->
  <text class="m" x="24" y="202" font-size="12.5" fill="#ffc857">solution I sabotaged myself</text>
  <rect x="184" y="192" width="440" height="20" rx="6" fill="#101a24" stroke="#1f2f3d"/>
  <rect class="bar b3" x="185" y="193" width="438" height="18" rx="5" fill="url(#rfill)"/>
  <text class="m val v3" x="646" y="202" font-size="15" font-weight="700" fill="#ff5c5c">reward 0.00</text>
  <g class="m" font-size="9" text-anchor="middle">
    <g class="pill" style="animation-delay:5.5s"><rect x="778" y="193" width="20" height="18" rx="5" fill="#3ee08f"/><text x="788" y="203" fill="#0b1410">✓</text></g>
    <g class="pill" style="animation-delay:5.65s"><rect x="802" y="193" width="20" height="18" rx="5" fill="#3ee08f"/><text x="812" y="203" fill="#0b1410">✓</text></g>
    <g class="pill" style="animation-delay:5.8s"><rect x="826" y="193" width="20" height="18" rx="5" fill="#3ee08f"/><text x="836" y="203" fill="#0b1410">✓</text></g>
    <g class="fail3"><rect x="850" y="193" width="20" height="18" rx="5" fill="#ff5c5c"/><text x="860" y="203" fill="#1a0b0d">✕</text></g>
  </g>

  <g class="note">
    <path d="M24 236 H876" stroke="#1b2836"/>
    <text class="m" x="24" y="262" font-size="12" fill="#8aa0b4">one corrupted field · three tests still pass · the fourth catches it</text>
    <text class="m" x="876" y="262" font-size="12" fill="#3ee08f" text-anchor="end">field-level, not file-exists ✓</text>
  </g>
</svg>
