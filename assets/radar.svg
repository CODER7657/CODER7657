<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Radar sweeping eighteen technologies in production">
  <title>Stack radar — 18 contacts, everything shipped</title>
  <defs>
    <radialGradient id="rbg" cx="50%" cy="50%"><stop offset="0%" stop-color="#0e1c26"/><stop offset="100%" stop-color="#070b10"/></radialGradient>
    <radialGradient id="blade" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#4dd6ff" stop-opacity=".40"/>
      <stop offset="60%" stop-color="#4dd6ff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#4dd6ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      text { dominant-baseline: middle; }
      .ring { fill:none; stroke:#1c3040; stroke-width:1; }
      .sweep { transform-box: view-box; transform-origin: 150px 150px; animation: spin 6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .blip { fill:#24485c; animation: ping 6s linear infinite forwards; }
      @keyframes ping { 0% { fill:#ffffff } 6% { fill:#4dd6ff } 40%,100% { fill:#24485c } }
      .halo { opacity:0; transform-box: fill-box; transform-origin: center; animation: halo 6s linear infinite forwards; }
      @keyframes halo { 0% { opacity:.85; transform: scale(.4) } 14% { opacity:0; transform: scale(3.6) } 15%,100% { opacity:0 } }
      .tag { fill:#4b6274; animation: tag 6s linear infinite forwards; }
      @keyframes tag { 0% { fill:#e6f2fb } 8% { fill:#9fd8f0 } 45%,100% { fill:#4b6274 } }
      .a0 { animation-delay: 0.000s }
      .a1 { animation-delay: 0.333s }
      .a2 { animation-delay: 0.667s }
      .a3 { animation-delay: 1.000s }
      .a4 { animation-delay: 1.333s }
      .a5 { animation-delay: 1.667s }
      .a6 { animation-delay: 2.000s }
      .a7 { animation-delay: 2.333s }
      .a8 { animation-delay: 2.667s }
      .a9 { animation-delay: 3.000s }
      .a10 { animation-delay: 3.333s }
      .a11 { animation-delay: 3.667s }
      .a12 { animation-delay: 4.000s }
      .a13 { animation-delay: 4.333s }
      .a14 { animation-delay: 4.667s }
      .a15 { animation-delay: 5.000s }
      .a16 { animation-delay: 5.333s }
      .a17 { animation-delay: 5.667s }
      .core { transform-box: fill-box; transform-origin: center; animation: core 2s ease-in-out infinite; }
      @keyframes core { 0%,100% { transform: scale(1); opacity:.9 } 50% { transform: scale(1.6); opacity:.35 } }
    </style>
  </defs>

  <rect width="900" height="300" rx="14" fill="#070b10"/>
  <rect x=".75" y=".75" width="898.5" height="298.5" rx="14" fill="none" stroke="#1b2836" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="136" fill="url(#rbg)"/>
  <g class="ring"><circle cx="150" cy="150" r="40"/><circle cx="150" cy="150" r="70"/><circle cx="150" cy="150" r="100"/><circle cx="150" cy="150" r="130"/></g>
  <g stroke="#152634"><path d="M150 20 V280"/><path d="M20 150 H280"/><path d="M58 58 L242 242"/><path d="M242 58 L58 242"/></g>

  <g class="sweep">
    <path d="M150 150 L51.8 66.4 A130 130 0 0 1 150 20 Z" fill="url(#blade)"/>
    <path d="M150 150 V20" stroke="#7de8ff" stroke-width="1.4" opacity=".85"/>
  </g>

  <g>
    <circle class="halo a0" cx="150.0" cy="32.0" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a0" cx="150.0" cy="32.0" r="3.2"/>
    <circle class="halo a1" cx="182.8" cy="59.8" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a1" cx="182.8" cy="59.8" r="3.2"/>
    <circle class="halo a2" cx="232.3" cy="51.9" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a2" cx="232.3" cy="51.9" r="3.2"/>
    <circle class="halo a3" cx="240.1" cy="98.0" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a3" cx="240.1" cy="98.0" r="3.2"/>
    <circle class="halo a4" cx="268.2" cy="129.2" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a4" cx="268.2" cy="129.2" r="3.2"/>
    <circle class="halo a5" cx="240.6" cy="166.0" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a5" cx="240.6" cy="166.0" r="3.2"/>
    <circle class="halo a6" cx="259.1" cy="213.0" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a6" cx="259.1" cy="213.0" r="3.2"/>
    <circle class="halo a7" cx="214.3" cy="226.6" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a7" cx="214.3" cy="226.6" r="3.2"/>
    <circle class="halo a8" cx="189.7" cy="259.0" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a8" cx="189.7" cy="259.0" r="3.2"/>
    <circle class="halo a9" cx="150.0" cy="238.0" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a9" cx="150.0" cy="238.0" r="3.2"/>
    <circle class="halo a10" cx="107.6" cy="266.5" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a10" cx="107.6" cy="266.5" r="3.2"/>
    <circle class="halo a11" cx="87.0" cy="225.1" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a11" cx="87.0" cy="225.1" r="3.2"/>
    <circle class="halo a12" cx="46.1" cy="210.0" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a12" cx="46.1" cy="210.0" r="3.2"/>
    <circle class="halo a13" cx="45.6" cy="168.4" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a13" cx="45.6" cy="168.4" r="3.2"/>
    <circle class="halo a14" cx="59.4" cy="134.0" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a14" cx="59.4" cy="134.0" r="3.2"/>
    <circle class="halo a15" cx="47.8" cy="91.0" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a15" cx="47.8" cy="91.0" r="3.2"/>
    <circle class="halo a16" cx="85.7" cy="73.4" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a16" cx="85.7" cy="73.4" r="3.2"/>
    <circle class="halo a17" cx="111.7" cy="44.8" r="3.2" fill="none" stroke="#4dd6ff"/><circle class="blip a17" cx="111.7" cy="44.8" r="3.2"/>
  </g>
  <circle class="core" cx="150" cy="150" r="5" fill="#4dd6ff"/>
  <circle cx="150" cy="150" r="2.4" fill="#eaffff"/>

  <g class="m" font-size="10.5">
    <circle class="blip a0" cx="330" cy="62" r="3"/><text class="tag a0" x="342" y="62">Python</text>
    <circle class="blip a1" cx="330" cy="95" r="3"/><text class="tag a1" x="342" y="95">NumPy · SciPy</text>
    <circle class="blip a2" cx="330" cy="128" r="3"/><text class="tag a2" x="342" y="128">pytest · Harbor</text>
    <circle class="blip a3" cx="330" cy="161" r="3"/><text class="tag a3" x="342" y="161">FastAPI</text>
    <circle class="blip a4" cx="330" cy="194" r="3"/><text class="tag a4" x="342" y="194">PostgreSQL</text>
    <circle class="blip a5" cx="330" cy="227" r="3"/><text class="tag a5" x="342" y="227">pgvector</text>
    <circle class="blip a6" cx="522" cy="62" r="3"/><text class="tag a6" x="534" y="62">Supabase</text>
    <circle class="blip a7" cx="522" cy="95" r="3"/><text class="tag a7" x="534" y="95">Kotlin</text>
    <circle class="blip a8" cx="522" cy="128" r="3"/><text class="tag a8" x="534" y="128">Android</text>
    <circle class="blip a9" cx="522" cy="161" r="3"/><text class="tag a9" x="534" y="161">React 19</text>
    <circle class="blip a10" cx="522" cy="194" r="3"/><text class="tag a10" x="534" y="194">TypeScript</text>
    <circle class="blip a11" cx="522" cy="227" r="3"/><text class="tag a11" x="534" y="227">Tailwind</text>
    <circle class="blip a12" cx="714" cy="62" r="3"/><text class="tag a12" x="726" y="62">Node.js</text>
    <circle class="blip a13" cx="714" cy="95" r="3"/><text class="tag a13" x="726" y="95">Docker</text>
    <circle class="blip a14" cx="714" cy="128" r="3"/><text class="tag a14" x="726" y="128">Rust</text>
    <circle class="blip a15" cx="714" cy="161" r="3"/><text class="tag a15" x="726" y="161">Solidity</text>
    <circle class="blip a16" cx="714" cy="194" r="3"/><text class="tag a16" x="726" y="194">Celery · Redis</text>
    <circle class="blip a17" cx="714" cy="227" r="3"/><text class="tag a17" x="726" y="227">Groq · Gemini</text>
  </g>

  <text class="m" x="330" y="28" font-size="11" fill="#e6f2fb">STACK RADAR</text>
  <text class="m" x="876" y="28" font-size="10.5" fill="#3d5265" text-anchor="end">18 contacts · shipped, not starred</text>
  <path d="M330 40 H876" stroke="#1b2836"/>
  <text class="m" x="330" y="272" font-size="10" fill="#3d5265">every one of these is in a repo that runs — not a badge on a list</text>
</svg>
