<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440" role="img" aria-label="Radar sweep lighting up the stack: Python, FastAPI, Postgres pgvector, Supabase, Kotlin, Android, React, TypeScript, Tailwind, Docker, Whisper, Groq and Gemini">
  <title>Stack radar — everything below is in production, not on a wishlist</title>
  <defs>
    <radialGradient id="rbg" cx="50%" cy="50%"><stop offset="0%" stop-color="#0e1c26"/><stop offset="100%" stop-color="#070b10"/></radialGradient>
    <radialGradient id="blade" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#4dd6ff" stop-opacity=".38"/>
      <stop offset="60%" stop-color="#4dd6ff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#4dd6ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      text { dominant-baseline: middle; }
      .ring { fill: none; stroke: #1c3040; stroke-width: 1; }
      .sweep { transform-box: view-box; transform-origin: 220px 220px; animation: spin 6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }

      .blip { fill: #24485c; animation: ping 6s linear infinite forwards; }
      @keyframes ping { 0% { fill:#ffffff } 6% { fill:#4dd6ff } 40%,100% { fill:#24485c } }
      .halo { opacity: 0; transform-box: fill-box; transform-origin: center; animation: halo 6s linear infinite forwards; }
      @keyframes halo { 0% { opacity:.85; transform: scale(.4) } 14% { opacity:0; transform: scale(3.4) } 15%,100% { opacity:0; transform: scale(3.4) } }
      .tag { fill: #4b6274; animation: tag 6s linear infinite forwards; }
      @keyframes tag { 0% { fill:#e6f2fb } 8% { fill:#9fd8f0 } 45%,100% { fill:#4b6274 } }

      .a0 { animation-delay: 0s }    .a1 { animation-delay: .5s }  .a2 { animation-delay: 1s }
      .a3 { animation-delay: 1.5s }  .a4 { animation-delay: 2s }   .a5 { animation-delay: 2.5s }
      .a6 { animation-delay: 3s }    .a7 { animation-delay: 3.5s } .a8 { animation-delay: 4s }
      .a9 { animation-delay: 4.5s }  .a10 { animation-delay: 5s }  .a11 { animation-delay: 5.5s }

      .core { transform-box: fill-box; transform-origin: center; animation: core 2s ease-in-out infinite; }
      @keyframes core { 0%,100% { transform: scale(1); opacity:.9 } 50% { transform: scale(1.6); opacity:.35 } }
    </style>
  </defs>

  <rect width="440" height="440" rx="14" fill="#070b10"/>
  <rect x=".75" y=".75" width="438.5" height="438.5" rx="14" fill="none" stroke="#1b2836" stroke-width="1.5"/>
  <circle cx="220" cy="220" r="192" fill="url(#rbg)"/>

  <g class="ring"><circle cx="220" cy="220" r="50"/><circle cx="220" cy="220" r="90"/><circle cx="220" cy="220" r="130"/><circle cx="220" cy="220" r="170"/></g>
  <g stroke="#152634" stroke-width="1"><path d="M220 30 V410"/><path d="M30 220 H410"/><path d="M85 85 L355 355"/><path d="M355 85 L85 355"/></g>

  <g class="sweep">
    <path d="M220 220 L74.5 97.9 A190 190 0 0 1 220 30 Z" fill="url(#blade)"/>
    <path d="M220 220 V30" stroke="#7de8ff" stroke-width="1.4" opacity=".85"/>
  </g>

  <circle class="core" cx="220" cy="220" r="5" fill="#4dd6ff"/>
  <circle cx="220" cy="220" r="2.4" fill="#eaffff"/>

  <g class="m" font-size="9.5">
    <circle class="halo a0" cx="220" cy="70" r="3.5" fill="none" stroke="#4dd6ff"/><circle class="blip a0" cx="220" cy="70" r="3.5"/><text class="tag a0" x="220" y="56" text-anchor="middle">Python</text>
    <circle class="halo a1" cx="275" cy="125" r="3.5" fill="none" stroke="#4dd6ff"/><circle class="blip a1" cx="275" cy="125" r="3.5"/><text class="tag a1" x="287" y="125">FastAPI</text>
    <circle class="halo a2" cx="359" cy="140" r="3.5" fill="none" stroke="#4dd6ff"/><circle class="blip a2" cx="359" cy="140" r="3.5"/><text class="tag a2" x="371" y="140">pgvector</text>
    <circle class="halo a3" cx="325" cy="220" r="3.5" fill="none" stroke="#4dd6ff"/><circle class="blip a3" cx="325" cy="220" r="3.5"/><text class="tag a3" x="337" y="220">Supabase</text>
    <circle class="halo a4" cx="354" cy="298" r="3.5" fill="none" stroke="#4dd6ff"/><circle class="blip a4" cx="354" cy="298" r="3.5"/><text class="tag a4" x="366" y="298">Kotlin</text>
    <circle class="halo a5" cx="270" cy="307" r="3.5" fill="none" stroke="#4dd6ff"/><circle class="blip a5" cx="270" cy="307" r="3.5"/><text class="tag a5" x="282" y="313">Android</text>
    <circle class="halo a6" cx="220" cy="365" r="3.5" fill="none" stroke="#4dd6ff"/><circle class="blip a6" cx="220" cy="365" r="3.5"/><text class="tag a6" x="220" y="379" text-anchor="middle">React 19</text>
    <circle class="halo a7" cx="168" cy="311" r="3.5" fill="none" stroke="#4dd6ff"/><circle class="blip a7" cx="168" cy="311" r="3.5"/><text class="tag a7" x="156" y="315" text-anchor="end">TypeScript</text>
    <circle class="halo a8" cx="86" cy="298" r="3.5" fill="none" stroke="#4dd6ff"/><circle class="blip a8" cx="86" cy="298" r="3.5"/><text class="tag a8" x="74" y="298" text-anchor="end">Tailwind</text>
    <circle class="halo a9" cx="110" cy="220" r="3.5" fill="none" stroke="#4dd6ff"/><circle class="blip a9" cx="110" cy="220" r="3.5"/><text class="tag a9" x="98" y="220" text-anchor="end">Docker</text>
    <circle class="halo a10" cx="81" cy="140" r="3.5" fill="none" stroke="#4dd6ff"/><circle class="blip a10" cx="81" cy="140" r="3.5"/><text class="tag a10" x="69" y="140" text-anchor="end">Whisper</text>
    <circle class="halo a11" cx="168" cy="129" r="3.5" fill="none" stroke="#4dd6ff"/><circle class="blip a11" cx="168" cy="129" r="3.5"/><text class="tag a11" x="156" y="125" text-anchor="end">Groq · Gemini</text>
  </g>

  <text class="m" x="18" y="20" font-size="10" fill="#3d5265">STACK RADAR</text>
  <text class="m" x="422" y="20" font-size="10" fill="#3d5265" text-anchor="end">shipped, not starred</text>
  <text class="m" x="220" y="424" font-size="10" fill="#3d5265" text-anchor="middle">12 contacts · 0 unknowns</text>
</svg>
