<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Seven agents on one side of a hard boundary, a human review gate, and a rogue agent action being blocked at the line">
  <title>Agent containment — seven agents, one boundary, zero of them touch a live verdict</title>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d141c"/><stop offset="100%" stop-color="#070b10"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3ee08f" stop-opacity=".35"/><stop offset="100%" stop-color="#3ee08f" stop-opacity="0"/></linearGradient>
    <radialGradient id="tok"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#ffc857"/><stop offset="100%" stop-color="#ffc857" stop-opacity="0"/></radialGradient>
    <radialGradient id="tok2"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#3ee08f"/><stop offset="100%" stop-color="#3ee08f" stop-opacity="0"/></radialGradient>
    <radialGradient id="tok3"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#ff5c5c"/><stop offset="100%" stop-color="#ff5c5c" stop-opacity="0"/></radialGradient>
    <filter id="g4" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      text { dominant-baseline: middle; }
      .flow { stroke-dasharray: 7 6; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -13 } }

      .ag { animation: agon 12s ease-out infinite both; transform-box: fill-box; transform-origin: center; }
      @keyframes agon { 0% { opacity:.35; transform: scale(.96) } 4% { opacity:1; transform: scale(1.04) } 9%,100% { opacity:.82; transform: scale(1) } }
      .g0{animation-delay:.1s}.g1{animation-delay:.3s}.g2{animation-delay:.5s}.g3{animation-delay:.7s}
      .g4{animation-delay:.9s}.g5{animation-delay:1.1s}.g6{animation-delay:1.3s}

      .stampD { animation: sd 12s ease-out 2.2s infinite both; }
      @keyframes sd { 0% { opacity:0 } 4%,22% { opacity:1 } 26%,100% { opacity:0 } }
      .stampA { animation: sa 12s cubic-bezier(.2,1.4,.4,1) 4.0s infinite both; transform-box: fill-box; transform-origin: center; }
      @keyframes sa { 0% { opacity:0; transform: scale(2.2) rotate(-12deg) } 4% { opacity:1; transform: scale(1) rotate(-7deg) } 60%,100% { opacity:0 } }

      .door { animation: door 12s ease-out 4.6s infinite both; }
      @keyframes door { 0% { opacity:0 } 3%,18% { opacity:1 } 24%,100% { opacity:0 } }

      .wall { animation: wall 12s linear 7.2s infinite both; }
      @keyframes wall { 0%,2% { stroke:#ff5c5c; stroke-opacity:.55 } 3% { stroke:#ff5c5c; stroke-opacity:1; stroke-width:4 } 8% { stroke-opacity:.55; stroke-width:2.2 } 100% { stroke-opacity:.55 } }
      .blocked { animation: blk 12s ease-out 7.3s infinite both; transform-box: fill-box; transform-origin: center; }
      @keyframes blk { 0% { opacity:0; transform: scale(.7) } 3% { opacity:1; transform: scale(1.06) } 5%,16% { opacity:1; transform: scale(1) } 22%,100% { opacity:0 } }

      .kill { animation: kill 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes kill { 0%,100% { opacity:1 } 50% { opacity:.3 } }
      .spend { transform-box: fill-box; transform-origin: left center; animation: spend 12s linear infinite both; }
      @keyframes spend { 0% { transform: scaleX(.05) } 85% { transform: scaleX(.62) } 100% { transform: scaleX(.62) } }
    </style>
  </defs>

  <rect width="900" height="380" rx="14" fill="url(#bg4)"/>
  <rect x=".75" y=".75" width="898.5" height="378.5" rx="14" fill="none" stroke="#1b2836" stroke-width="1.5"/>

  <text class="m" x="24" y="26" font-size="13" fill="#e6f2fb">agent architecture</text>
  <text class="m" x="876" y="26" font-size="11.5" fill="#3d5265" text-anchor="end">7 agents · 1 boundary · 0 of them touch a live verdict</text>
  <path d="M24 44 H876" stroke="#1b2836"/>

  <!-- ================= HOT PATH ================= -->
  <rect x="24" y="60" width="386" height="250" rx="12" fill="#0a1319" stroke="#1e3a2c" stroke-width="1.5"/>
  <rect x="24" y="60" width="386" height="26" rx="12" fill="url(#hot)"/>
  <text class="m" x="40" y="74" font-size="11" fill="#3ee08f">HOT PATH · deterministic · ~200ms · offline-capable</text>

  <g class="m" font-size="10.5" text-anchor="middle">
    <rect x="48" y="120" width="96" height="46" rx="9" fill="#0f1822" stroke="#26404f"/><text x="96" y="136" fill="#c9d6e2">message</text><text x="96" y="152" fill="#4b6274">on device</text>
    <rect x="168" y="120" width="96" height="46" rx="9" fill="#0f1822" stroke="#26404f"/><text x="216" y="136" fill="#c9d6e2">rules</text><text x="216" y="152" fill="#4b6274">same in → same out</text>
    <rect x="288" y="120" width="96" height="46" rx="9" fill="#0f1822" stroke="#3ee08f"/><text x="336" y="136" fill="#3ee08f">verdict</text><text x="336" y="152" fill="#4b6274">user acts on it</text>
    <path class="flow" d="M144 143 H168 M264 143 H288" stroke="#3ee08f" stroke-width="1.6" fill="none" opacity=".8"/>
  </g>

  <g class="m" font-size="10.5">
    <rect x="48" y="196" width="336" height="34" rx="9" fill="#0d1620" stroke="#233444"/>
    <text x="64" y="213" fill="#4b6274">pattern corpus · every entry human-approved, provenance recorded</text>
  </g>
  <text class="m" x="48" y="262" font-size="10.5" fill="#3ee08f">🔒 no agent, no LLM loop, no network dependency in this box</text>
  <text class="m" x="48" y="282" font-size="10.5" fill="#4b6274">speed, determinism and auditability are not tradeable here</text>

  <!-- ================= BOUNDARY ================= -->
  <path class="wall" d="M430 60 V244" stroke="#ff5c5c" stroke-width="2.2" stroke-opacity=".55" stroke-dasharray="9 7"/>
  <path class="wall" d="M430 286 V310" stroke="#ff5c5c" stroke-width="2.2" stroke-opacity=".55" stroke-dasharray="9 7"/>
  <text class="m" x="430" y="52" font-size="10" fill="#ff8f8f" text-anchor="middle">BOUNDARY</text>

  <!-- the one door -->
  <g class="m" font-size="9">
    <path d="M420 244 H440 M420 286 H440" stroke="#3ee08f" stroke-width="1.6"/>
    <text x="430" y="326" fill="#3ee08f" text-anchor="middle">the only door</text>
  </g>

  <g class="blocked m" font-size="10">
    <rect x="352" y="88" width="76" height="20" rx="6" fill="#2a1013" stroke="#ff5c5c"/>
    <text x="390" y="99" fill="#ff8f8f" text-anchor="middle">BLOCKED</text>
  </g>

  <!-- ================= AGENT ZONE ================= -->
  <rect x="450" y="60" width="426" height="250" rx="12" fill="#0a1019" stroke="#2a2540" stroke-width="1.5"/>
  <text class="m" x="466" y="74" font-size="11" fill="#a78bfa">AGENT ZONE · open-ended · reviewable · killable</text>

  <g class="m" font-size="9.5" text-anchor="middle">
    <g class="ag g0"><rect x="466" y="92" width="94" height="34" rx="8" fill="#140f22" stroke="#3b3160"/><text x="513" y="103" fill="#c4b5fd">A1 discovery</text><text x="513" y="116" fill="#5b5080">drafts only</text></g>
    <g class="ag g1"><rect x="570" y="92" width="94" height="34" rx="8" fill="#140f22" stroke="#3b3160"/><text x="617" y="103" fill="#c4b5fd">A2 phishing</text><text x="617" y="116" fill="#5b5080">sandboxed</text></g>
    <g class="ag g2"><rect x="674" y="92" width="94" height="34" rx="8" fill="#140f22" stroke="#3b3160"/><text x="721" y="103" fill="#c4b5fd">A3 correlator</text><text x="721" y="116" fill="#5b5080">read-only</text></g>
    <g class="ag g3"><rect x="778" y="92" width="84" height="34" rx="8" fill="#140f22" stroke="#3b3160"/><text x="820" y="103" fill="#c4b5fd">A4 triage</text><text x="820" y="116" fill="#5b5080">bounded</text></g>
    <g class="ag g4"><rect x="466" y="134" width="94" height="34" rx="8" fill="#140f22" stroke="#3b3160"/><text x="513" y="145" fill="#c4b5fd">A5 analyst</text><text x="513" y="158" fill="#5b5080">read-only</text></g>
    <g class="ag g5"><rect x="570" y="134" width="94" height="34" rx="8" fill="#241016" stroke="#7a2b3a"/><text x="617" y="145" fill="#ff9db0">A6 red team</text><text x="617" y="158" fill="#8a5563">attacks us</text></g>
    <g class="ag g6"><rect x="674" y="134" width="94" height="34" rx="8" fill="#140f22" stroke="#3b3160"/><text x="721" y="145" fill="#c4b5fd">A7 localiser</text><text x="721" y="158" fill="#5b5080">drafts only</text></g>
    <g class="ag g6"><rect x="778" y="134" width="84" height="34" rx="8" fill="#0f1822" stroke="#26404f"/><text x="820" y="145" fill="#8aa0b4">typed</text><text x="820" y="158" fill="#4b6274">contracts</text></g>
  </g>

  <!-- human gate -->
  <rect x="466" y="196" width="396" height="52" rx="10" fill="#0f1620" stroke="#ffc857" stroke-width="1.5"/>
  <text class="m" x="486" y="214" font-size="11.5" fill="#ffc857">HUMAN REVIEW GATE</text>
  <text class="m" x="486" y="232" font-size="10" fill="#4b6274">nothing an agent writes reaches a user until a person accepts it</text>
  <g class="m stampD" font-size="11"><rect x="762" y="208" width="82" height="28" rx="7" fill="#231a09" stroke="#7a5f1e"/><text x="803" y="222" fill="#ffc857" text-anchor="middle">DRAFT</text></g>
  <g class="m stampA" font-size="11"><rect x="762" y="208" width="82" height="28" rx="7" fill="#0d2418" stroke="#3ee08f"/><text x="803" y="222" fill="#3ee08f" text-anchor="middle">ACCEPTED</text></g>

  <!-- draft token: agent -> gate -->
  <g filter="url(#g4)">
    <circle r="5.5" fill="url(#tok)" opacity="0">
      <animateMotion dur="12s" begin="2.0s" repeatCount="indefinite" path="M513 126 C513 170 700 160 803 196"/>
      <animate attributeName="opacity" dur="12s" begin="2.0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.02;.13;.16;1"/>
    </circle>
  </g>
  <!-- accepted token: gate -> through the door -> corpus -->
  <g filter="url(#g4)">
    <circle r="5.5" fill="url(#tok2)" opacity="0">
      <animateMotion dur="12s" begin="4.6s" repeatCount="indefinite" path="M780 248 C700 300 520 266 430 265 L216 213"/>
      <animate attributeName="opacity" dur="12s" begin="4.6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.02;.14;.17;1"/>
    </circle>
  </g>
  <!-- rogue token: agent -> boundary -> bounced back -->
  <g filter="url(#g4)">
    <circle r="5.5" fill="url(#tok3)" opacity="0">
      <animateMotion dur="12s" begin="6.6s" repeatCount="indefinite" keyPoints="0;0.5;0.5;1" keyTimes="0;.05;.055;.11" calcMode="linear"
                     path="M617 126 L436 118 L436 118 L617 126"/>
      <animate attributeName="opacity" dur="12s" begin="6.6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.01;.10;.12;1"/>
    </circle>
  </g>

  <!-- footer instruments -->
  <path d="M24 330 H876" stroke="#1b2836"/>
  <g class="m" font-size="10.5">
    <circle class="kill" cx="34" cy="356" r="4" fill="#ff5c5c"/>
    <text x="46" y="356" fill="#8aa0b4">kill switch per agent</text>
    <text x="212" y="356" fill="#4b6274">spend</text>
    <rect x="252" y="349" width="150" height="13" rx="6" fill="#101a24" stroke="#1f2f3d"/>
    <rect class="spend" x="253" y="350" width="148" height="11" rx="5" fill="#ffc857" opacity=".8"/>
    <text x="414" y="356" fill="#4b6274">cap enforced — stop, never degrade</text>
    <text x="876" y="356" fill="#8aa0b4" text-anchor="end">typed contracts, never free-form chat</text>
  </g>
</svg>
