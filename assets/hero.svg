<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Terminal: Pavan Patel — AI systems and evaluation engineering">
  <title>pavan@github — whoami --deep</title>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1721"/>
      <stop offset="100%" stop-color="#070b10"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4dd6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4dd6ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4dd6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4dd6ff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#3ee08f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4dd6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#4dd6ff" fill-opacity="0.09"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="crt"><rect class="crt" x="0" y="0" width="900" height="330"/></clipPath>
    <clipPath id="c1"><rect class="tp d1" x="46" y="96"  width="700" height="20"/></clipPath>
    <clipPath id="c2"><rect class="tp d2" x="46" y="124" width="760" height="20"/></clipPath>
    <clipPath id="c3"><rect class="tp d3" x="46" y="152" width="760" height="20"/></clipPath>
    <clipPath id="c4"><rect class="tp d4" x="46" y="180" width="760" height="20"/></clipPath>
    <clipPath id="c5"><rect class="tp d5" x="46" y="216" width="760" height="20"/></clipPath>
    <clipPath id="c6"><rect class="tp d6" x="46" y="252" width="760" height="26"/></clipPath>

    <style>
      .m  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      text { dominant-baseline: middle; }
      .tp { transform-box: fill-box; transform-origin: left center;
            animation: type 15s steps(34) infinite both; }
      @keyframes type { 0% { transform: scaleX(0); } 6% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
      .d1 { animation-delay: 0.35s } .d2 { animation-delay: 1.5s } .d3 { animation-delay: 2.5s }
      .d4 { animation-delay: 3.5s } .d5 { animation-delay: 4.7s } .d6 { animation-delay: 6.0s }

      .crt { transform-box: fill-box; transform-origin: center; animation: crt 15s linear infinite; }
      @keyframes crt { 0%,90% { transform: scaleY(1) } 95% { transform: scaleY(.02) } 97%,100% { transform: scaleY(0) } }

      .cur { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }

      .sweep { animation: sweep 7.5s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes sweep { 0% { transform: translateY(-60px) } 100% { transform: translateY(340px) } }

      .live { animation: live 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes live { 0%,100% { opacity:1; transform: scale(1) } 50% { opacity:.35; transform: scale(.72) } }

      .rule { stroke-dasharray: 820; stroke-dashoffset: 820; animation: draw 15s ease-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 820 } 12%,100% { stroke-dashoffset: 0 } }
    </style>
  </defs>

  <rect width="900" height="330" rx="14" fill="url(#glass)"/>
  <rect width="900" height="330" rx="14" fill="url(#dots)"/>
  <rect x="0" y="0" width="900" height="60" class="sweep" fill="url(#beam)"/>

  <rect x="0.75" y="0.75" width="898.5" height="328.5" rx="14" fill="none" stroke="#1b2836" stroke-width="1.5"/>
  <path d="M0 46 H900" stroke="#1b2836" stroke-width="1.5"/>
  <circle cx="26" cy="23" r="5.5" fill="#ff5f57"/><circle cx="46" cy="23" r="5.5" fill="#febc2e"/><circle cx="66" cy="23" r="5.5" fill="#28c840"/>
  <text class="m" x="450" y="24" text-anchor="middle" font-size="12.5" fill="#5b7085">pavan@github — ~/work — zsh</text>
  <circle class="live" cx="828" cy="23" r="4" fill="#3ee08f"/>
  <text class="m" x="842" y="24" font-size="11" fill="#3ee08f">LIVE</text>

  <g clip-path="url(#crt)">
    <g clip-path="url(#c1)">
      <text class="m" x="46" y="106" font-size="14.5" fill="#3ee08f">➜ <tspan fill="#4dd6ff">~</tspan> <tspan fill="#c9d6e2">whoami --deep</tspan></text>
    </g>

    <g clip-path="url(#c2)">
      <text class="m" x="46" y="134" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="1.5">PAVAN PATEL</text>
    </g>
    <g clip-path="url(#c3)">
      <text class="m" x="46" y="162" font-size="14.5" fill="#8aa0b4">I build AI systems that must not be wrong — and the evals that prove when they are</text>
    </g>
    <g clip-path="url(#c4)">
      <text class="m" x="46" y="190" font-size="13.5" fill="#5b7085">Ahmedabad, IN · multi-agent systems · guardrails &amp; agent safety · benchmark authoring</text>
    </g>

    <path class="rule" d="M46 204 H866" stroke="url(#rule)" stroke-width="1.5" fill="none"/>

    <g clip-path="url(#c5)">
      <text class="m" x="46" y="226" font-size="13.5" fill="#5b7085">
        <tspan fill="#3ee08f">shipping</tspan><tspan fill="#5b7085">  raksha-ai   </tspan><tspan fill="#ffc857">authoring</tspan><tspan fill="#5b7085">  22 agent-benchmark tasks   </tspan><tspan fill="#4dd6ff">reading for</tspan><tspan fill="#5b7085">  2 degrees at once</tspan>
      </text>
    </g>

    <g clip-path="url(#c6)">
      <text class="m" x="46" y="264" font-size="14.5" fill="#3ee08f">➜ <tspan fill="#4dd6ff">~</tspan> <tspan fill="#c9d6e2">scroll --for=receipts</tspan></text>
    </g>
    <rect class="cur" x="286" y="254" width="9" height="18" fill="#3ee08f"/>
  </g>

  <g filter="url(#soft)" opacity="0.55">
    <path d="M46 296 H140" stroke="#4dd6ff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text class="m" x="46" y="308" font-size="11" fill="#3d5265">82 commits · 204 files · 4 humans · 1 codebase that refuses to lie</text>
</svg>
