.d0 { animation-delay: 0.4s }      .d1 { animation-delay: 1.3s }      .d2 { animation-delay: 2.0s }      .d3 { animation-delay: 2.6s }      .d4 { animation-delay: 3.9s }      .d5 { animation-delay: 4.8s }      .d6 { animation-delay: 6.0s }      .d7 { animation-delay: 6.9s }      .d8 { animation-delay: 7.5s }      .d9 { animation-delay: 8.1s }      .d10 { animation-delay: 9.3s }
