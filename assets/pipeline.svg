<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="A scam message travelling through the interception pipeline and coming out with a verdict">
  <title>Interception pipeline — message in, grounded verdict out</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d141c"/><stop offset="100%" stop-color="#070b10"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4dd6ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff5c5c" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="pk"><stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#4dd6ff"/><stop offset="100%" stop-color="#4dd6ff" stop-opacity="0"/></radialGradient>
    <filter id="g2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="track" d="M126 150 H222 M258 150 H354 M390 150 H486 M522 150 H618 M654 150 H714"/>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      text { dominant-baseline: middle; }
      .node { fill: #0f1822; stroke: #223243; transform-box: fill-box; transform-origin: center; animation: fire 9s ease-in-out infinite both; }
      @keyframes fire {
        0%, 8%   { stroke: #223243; fill: #0f1822; }
        12%      { stroke: #4dd6ff; fill: #10202c; }
        26%,100% { stroke: #223243; fill: #0f1822; }
      }
      .n1 { animation-delay: 0s } .n2 { animation-delay: 1.1s } .n3 { animation-delay: 2.2s }
      .n4 { animation-delay: 3.3s } .n5 { animation-delay: 4.4s }

      .lbl { fill: #5b7085; animation: lit 9s ease-in-out infinite both; }
      @keyframes lit { 0%,8% { fill:#5b7085 } 13%,24% { fill:#e6f2fb } 30%,100% { fill:#5b7085 } }
      .l1 { animation-delay: 0s } .l2 { animation-delay: 1.1s } .l3 { animation-delay: 2.2s }
      .l4 { animation-delay: 3.3s } .l5 { animation-delay: 4.4s }

      .hit { animation: hit 9s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes hit { 0%,9% { opacity:0; transform: scale(.4) } 14% { opacity:.9; transform: scale(1.9) } 22%,100% { opacity:0; transform: scale(2.4) } }
      .h1 { animation-delay: 0s } .h2 { animation-delay: 1.1s } .h3 { animation-delay: 2.2s }
      .h4 { animation-delay: 3.3s } .h5 { animation-delay: 4.4s }

      .chip { animation: chip 9s ease-out infinite; opacity: 0; }
      @keyframes chip { 0%,24% { opacity:0; transform: translateX(28px) } 30% { opacity:1; transform: translateX(0) } 44%,100% { opacity:0; transform: translateX(0) } }
      .k1 { animation-delay: 2.0s } .k2 { animation-delay: 2.18s } .k3 { animation-delay: 2.36s }

      .verdict { animation: verdict 9s cubic-bezier(.2,.9,.2,1) infinite; opacity: 0; transform-box: fill-box; transform-origin: center; }
      @keyframes verdict { 0%,58% { opacity:0; transform: scale(.86) } 64% { opacity:1; transform: scale(1) } 94% { opacity:1 } 100% { opacity:0 } }
      .flag { animation: flag 9s ease-out infinite; opacity: 0; }
      @keyframes flag { 0%,64% { opacity:0 } 70%,94% { opacity:1 } 100% { opacity:0 } }
      .f2 { animation-delay: .35s } .f3 { animation-delay: .7s }
      .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity:.25; transform: scale(1) } 50% { opacity:.75; transform: scale(1.35) } }
    </style>
  </defs>

  <rect width="900" height="300" rx="14" fill="url(#bg2)"/>
  <rect x=".75" y=".75" width="898.5" height="298.5" rx="14" fill="none" stroke="#1b2836" stroke-width="1.5"/>
  <text class="m" x="24" y="26" font-size="12" fill="#3d5265">raksha-ai / interception path</text>
  <text class="m" x="876" y="26" font-size="12" fill="#3d5265" text-anchor="end">p50 &lt; 3s · 12 languages · evidence or it doesn't ship</text>

  <use href="#track" stroke="url(#wire)" stroke-width="1.6" stroke-dasharray="4 5" fill="none"/>

  <!-- inbound message -->
  <g>
    <rect x="24" y="120" width="102" height="60" rx="10" fill="#0f1822" stroke="#2a3a4a" stroke-width="1.5"/>
    <text class="m" x="75" y="140" font-size="10.5" fill="#5b7085" text-anchor="middle">INBOUND</text>
    <text class="m" x="75" y="157" font-size="11" fill="#c9d6e2" text-anchor="middle">"KYC block —</text>
    <text class="m" x="75" y="171" font-size="11" fill="#c9d6e2" text-anchor="middle">pay ₹10 now"</text>
  </g>

  <g class="m" font-size="10.5" text-anchor="middle">
    <!-- 1 rules -->
    <rect class="node n1" x="222" y="122" width="96" height="56" rx="10" stroke-width="1.5"/>
    <circle class="hit h1" cx="270" cy="150" r="10" fill="none" stroke="#4dd6ff" stroke-width="1.2"/>
    <text class="lbl l1" x="270" y="142">RULES</text><text class="lbl l1" x="270" y="160">offline · 0ms</text>

    <!-- 2 embed -->
    <rect class="node n2" x="354" y="122" width="96" height="56" rx="10" stroke-width="1.5"/>
    <circle class="hit h2" cx="402" cy="150" r="10" fill="none" stroke="#4dd6ff" stroke-width="1.2"/>
    <text class="lbl l2" x="402" y="142">EMBED</text><text class="lbl l2" x="402" y="160">local · free</text>

    <!-- 3 retrieve -->
    <rect class="node n3" x="486" y="122" width="96" height="56" rx="10" stroke-width="1.5"/>
    <circle class="hit h3" cx="534" cy="150" r="10" fill="none" stroke="#4dd6ff" stroke-width="1.2"/>
    <text class="lbl l3" x="534" y="142">pgvector</text><text class="lbl l3" x="534" y="160">top-k scams</text>

    <!-- 4 judge -->
    <rect class="node n4" x="618" y="122" width="96" height="56" rx="10" stroke-width="1.5"/>
    <circle class="hit h4" cx="666" cy="150" r="10" fill="none" stroke="#4dd6ff" stroke-width="1.2"/>
    <text class="lbl l4" x="666" y="142">LLM JUDGE</text><text class="lbl l4" x="666" y="160">grounded</text>
  </g>

  <!-- retrieved evidence chips flying in -->
  <g class="m" font-size="9.5">
    <g class="chip k1"><rect x="470" y="70" width="128" height="17" rx="8" fill="#12202b" stroke="#2c4457"/><text x="534" y="79" fill="#8aa0b4" text-anchor="middle">pattern #4412 · 0.91</text></g>
    <g class="chip k2"><rect x="470" y="91" width="128" height="17" rx="8" fill="#12202b" stroke="#2c4457"/><text x="534" y="100" fill="#8aa0b4" text-anchor="middle">pattern #0938 · 0.87</text></g>
    <g class="chip k3"><rect x="470" y="196" width="128" height="17" rx="8" fill="#12202b" stroke="#2c4457"/><text x="534" y="205" fill="#8aa0b4" text-anchor="middle">pattern #2201 · 0.84</text></g>
  </g>

  <!-- verdict -->
  <g class="verdict">
    <rect x="726" y="96" width="150" height="108" rx="12" fill="#1a0f13" stroke="#ff5c5c" stroke-width="1.5"/>
    <circle class="pulse" cx="801" cy="96" r="7" fill="#ff5c5c"/>
    <text class="m" x="801" y="118" font-size="10.5" fill="#ff8f8f" text-anchor="middle">VERDICT</text>
    <text class="m" x="801" y="140" font-size="22" font-weight="700" fill="#ff5c5c" text-anchor="middle">SCAM 0.93</text>
    <g class="m" font-size="9.5" text-anchor="middle">
      <text class="flag"    x="801" y="164" fill="#c9a3a3">▸ urgency + payment ask</text>
      <text class="flag f2" x="801" y="178" fill="#c9a3a3">▸ impersonates bank KYC</text>
      <text class="flag f3" x="801" y="192" fill="#c9a3a3">▸ unknown UPI handle</text>
    </g>
  </g>

  <!-- travelling packet -->
  <g filter="url(#g2)">
    <circle r="7" fill="url(#pk)">
      <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;0.06;0.24;0.30;0.48;0.54;0.72;0.78;0.96;1"
                     keyTimes="0;0.06;0.20;0.26;0.40;0.46;0.60;0.66;0.80;1" calcMode="linear"
                     path="M96 150 H222 M258 150 H354 M390 150 H486 M522 150 H618 M654 150 H726"/>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.78;0.83;1"/>
    </circle>
  </g>

  <text class="m" x="24" y="272" font-size="11" fill="#3d5265">rules first (works with no network) → retrieval second (grounds it) → model last (explains it, never invents it)</text>
</svg>
